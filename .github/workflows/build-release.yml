on:
  push:
    branches:
      - master

name: build-release

permissions: 
  contents: write

jobs:
  build:
    name: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"

      - run: sudo npm i -g @vercel/ncc

      - run: npm install 

      - name: Compile files
        run: |
          ncc build -C -m src/entrypoint.ts

      - name: Commit Files
        continue-on-error: true # commit will fail if the code wasn't changed. Prevent the build to fail in this case.
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add dist/index.js -f
          git commit -m "Add changes"

      - name: Push changes
        uses: ad-m/github-push-action@d30dc2d070765d7e509df00c34c5fa2dd636ff74 # master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
